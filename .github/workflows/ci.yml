name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest

  mcp-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install './mcp_adapter[test]'
      - run: pytest
        working-directory: mcp_adapter
      - run: pip wheel --no-deps --wheel-dir /tmp/avs-mcp-wheel ./mcp_adapter

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  image-build:
    name: image-${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform ${{ matrix.platform }} --load --tag ai-video-station:ci-${{ matrix.tag }} .

  fnos-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official fnpack
        run: |
          curl --fail --location --silent --show-error \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            --output /tmp/fnpack
          chmod 0755 /tmp/fnpack
          /tmp/fnpack --help
      - name: Build fnOS FPK
        env:
          FNPACK_BIN: /tmp/fnpack
        run: ./fnos/build.sh /tmp/fnos-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ai-video-station-fnos
          path: /tmp/fnos-dist/ai-video-station-2.2.0.fpk
          if-no-files-found: error
