    parameters: [{$ref: '#/components/parameters/PlanId'}]
    get:
      summary: Get one duplicate cleanup plan
      x-agent-scope: read
      security: [{ApiKey: []}, {AgentToken: []}]
      responses: {'200': {description: Cleanup plan}, '404': {$ref: '#/components/responses/NotFound'}, default: {$ref: '#/components/responses/Problem'}}
  /api/cleanup/plans/{plan_id}/execute:
    parameters: [{$ref: '#/components/parameters/PlanId'}]
    post:
      summary: Execute explicitly selected duplicate cleanup versions
      description: AVS validates every selected and retained file before changing any path. It removes selected library hardlinks first; source deletion is opt-in.
      x-agent-scope: cleanup
      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CleanupExecuteRequest'}}}}
      responses: {'200': {description: Updated plan and per-version results}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Validation'}, default: {$ref: '#/components/responses/Problem'}}
  /api/cleanup/plans/{plan_id}/retry:
    parameters: [{$ref: '#/components/parameters/PlanId'}]
    post:
      summary: Retry failed items using the previously confirmed selections and source-delete mode
      x-agent-scope: cleanup
      security: [{ApiKey: []}, {AgentToken: []}]
      responses: {'200': {description: Updated plan and retry results}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, default: {$ref: '#/components/responses/Problem'}}
