openapi: 3.1.0
info:
  title: AI Video Station API
  version: 2.2.0
  description: >-
    Player-neutral media search, downloads, watchlists, media-library-compatible naming, hardlinks,
    duplicate cleanup, path rules and Agent access. Standard output directories can be scanned by
    fnOS Video, Emby, Jellyfin and other compatible media software. Unless an operation says otherwise,
    an Agent token needs the documented x-agent-scope.
servers:
  - url: http://localhost:16666
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Administrator API key.
    AgentToken:
      type: http
      scheme: bearer
      bearerFormat: avs_agent
      description: Revocable avs_agent_* token issued by an administrator.
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        request_id: {type: [string, 'null'], description: Include when contacting an administrator.}
        errors:
          type: array
          description: Field-level validation errors when applicable.
          items:
            type: object
            required: [field, message, code]
            properties:
              field: {type: string}
              message: {type: string}
              code: {type: string}
    MediaType:
      type: string
      enum: [movie, tv, anime, custom, auto]
    ViewingMode:
      type: string
      enum: [daily, collection, compact]
      description: >-
        daily prefers 1080p, collection prefers the highest available resolution,
        and compact prefers 720p. All modes are soft preferences and retain fallbacks.
    ResourcePreferences:
      type: object
      additionalProperties: false
      description: Stored preference snapshot used to rank acceptable non-cam releases.
      properties:
        mode: {$ref: '#/components/schemas/ViewingMode'}
        resolution_order:
          type: array
          uniqueItems: true
          items: {type: string, enum: [4320p, 2160p, 1080p, 720p, 480p, unknown]}
        source_order:
          type: array
          uniqueItems: true
          items: {type: string, enum: [Remux, BluRay, WEB-DL, HDTV, HD, unknown]}
        audio_order:
          type: array
          uniqueItems: true
          items: {type: string, enum: [multi, original, zh, en, other, unknown]}
        size_preference: {type: string, enum: [smaller, larger]}
    AgentScope:
      type: string
      enum: [read, search, download, watchlist, naming, cleanup, settings]
    SearchRequest:
      type: object
      required: [keyword]
      additionalProperties: false
      properties:
        keyword: {type: string, minLength: 1, maxLength: 100}
        type: {$ref: '#/components/schemas/MediaType'}
        add_to_watchlist:
          type: boolean
          default: false
          description: >-
            Defaults to false, so search is read-only. If true, a watchlist scope is also
            required. The aliases addto_watchlist and addToWatchlist are accepted.
        viewing_mode:
          allOf: [{$ref: '#/components/schemas/ViewingMode'}]
          default: daily
          description: Applied only when add_to_watchlist is true.
    Release:
      type: object
      required: [id, title, download_link, type]
      properties:
        id: {type: string}
        title: {type: string}
        url: {type: string}
        download_link: {type: string}
        size: {type: [string, 'null']}
        resolution: {type: [string, 'null']}
        source: {type: [string, 'null']}
        language: {type: [string, 'null']}
        hdr: {type: [string, 'null']}
        encoding: {type: [string, 'null']}
        type: {$ref: '#/components/schemas/MediaType'}
        episode: {type: [string, 'null']}
        media_name: {type: [string, 'null']}
        original_title: {type: [string, 'null']}
        year: {type: [integer, 'null']}
        season: {type: [integer, 'null']}
        link_name: {type: [string, 'null']}
        part: {type: [string, 'null']}
        edition: {type: [string, 'null']}
        video_format: {type: [string, 'null']}
        episode_title: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        audio_languages: {type: array, items: {type: string}}
        original_language: {type: [string, 'null']}
        episodes: {type: array, items: {type: string}}
    DownloadRequest:
      type: object
      required: [result_id, download_link, title]
      additionalProperties: false
      properties:
        result_id: {type: string, minLength: 8, maxLength: 64}
        download_link: {type: string, minLength: 8, maxLength: 8192}
        title: {type: string, minLength: 1, maxLength: 500}
        type: {$ref: '#/components/schemas/MediaType'}
        path_rule_id: {type: [string, 'null'], minLength: 8, maxLength: 64}
    ManualDownloadRequest:
      type: object
      required: [download_link]
      additionalProperties: false
      properties:
        download_link: {type: string, minLength: 8, maxLength: 8192}
        title: {type: [string, 'null'], minLength: 1, maxLength: 500, description: Required when the link does not contain a usable resource name such as a magnet dn parameter.}
        type: {$ref: '#/components/schemas/MediaType'}
        original_title: {type: [string, 'null'], maxLength: 300}
        edition: {type: [string, 'null'], maxLength: 100}
        episode_title: {type: [string, 'null'], maxLength: 300}
        path_rule_id: {type: [string, 'null'], minLength: 8, maxLength: 64}
        subscribe:
          type: boolean
          default: false
          description: Add episodic media to the watchlist after the download is accepted.
        viewing_mode:
          allOf: [{$ref: '#/components/schemas/ViewingMode'}]
          default: daily
    ManualTorrentRequest:
      type: object
      required: [torrent]
      additionalProperties: false
      properties:
        torrent: {type: string, format: binary}
        title: {type: [string, 'null'], minLength: 1, maxLength: 500}
        type: {$ref: '#/components/schemas/MediaType'}
        original_title: {type: [string, 'null'], maxLength: 300}
        edition: {type: [string, 'null'], maxLength: 100}
        episode_title: {type: [string, 'null'], maxLength: 300}
        path_rule_id: {type: [string, 'null'], minLength: 8, maxLength: 64}
        subscribe:
          type: boolean
          default: false
          description: Add episodic media to the watchlist after the download is accepted.
        viewing_mode:
          allOf: [{$ref: '#/components/schemas/ViewingMode'}]
          default: daily
    WatchlistAddRequest:
      type: object
      required: [keyword]
      additionalProperties: false
      properties:
        keyword: {type: string, minLength: 1, maxLength: 100}
        type: {$ref: '#/components/schemas/MediaType'}
        path_rule_id: {type: [string, 'null'], minLength: 8, maxLength: 64}
        viewing_mode:
          allOf: [{$ref: '#/components/schemas/ViewingMode'}]
          default: daily
        resource_preferences:
          oneOf:
            - {$ref: '#/components/schemas/ResourcePreferences'}
            - {type: 'null'}
    WatchlistPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        viewing_mode:
          oneOf:
            - {$ref: '#/components/schemas/ViewingMode'}
            - {type: 'null'}
        resource_preferences:
          oneOf:
            - {$ref: '#/components/schemas/ResourcePreferences'}
            - {type: 'null'}
    WatchlistCheckRequest:
      type: object
      additionalProperties: false
      properties:
        item_id: {type: [string, 'null'], minLength: 8, maxLength: 64}
    NamingStatus:
      type: string
      enum: [submitting, awaiting_binding, pending, waiting_metadata, waiting_selection, waiting_download, retrying, completed, failed, missing_in_downloader]
    HardlinkStatus:
      type: [string, 'null']
      enum: [pending, waiting_download, retrying, done, partial, conflict, failed, disabled, null]
    DirectorySyncScanRequest:
      type: object
      additionalProperties: false
      properties:
        path_rule_id: {type: [string, 'null'], minLength: 8, maxLength: 64}
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
    NamingPlanOverride:
      type: object
      additionalProperties: false
      description: Supply at least one field when calling a preview or plan update.
      properties:
        media_type: {type: string, enum: [movie, tv, anime, custom]}
        media_name: {type: [string, 'null'], minLength: 1, maxLength: 300}
        original_title: {type: [string, 'null'], maxLength: 300}
        year: {type: [integer, 'null'], minimum: 1888, maximum: 2100}
        season: {type: [integer, 'null'], minimum: 0, maximum: 999}
        episode: {type: [string, 'null'], maxLength: 100}
        episode_title: {type: [string, 'null'], maxLength: 300}
        edition: {type: [string, 'null'], maxLength: 100}
        part: {type: [string, 'null'], maxLength: 100}
        video_format: {type: [string, 'null'], maxLength: 100}
        rename_enabled: {type: [boolean, 'null']}
    NamingCheckRequest:
      type: object
      additionalProperties: false
      properties:
        job_id: {type: [string, 'null'], minLength: 8, maxLength: 64}
    CleanupPolicy:
      type: string
      enum: [quality_first, space_first]
    CleanupScanRequest:
      type: object
      additionalProperties: false
      properties:
        policy: {allOf: [{$ref: '#/components/schemas/CleanupPolicy'}], default: quality_first}
        media_type: {type: [string, 'null'], enum: [movie, tv, anime, custom, null]}
    CleanupSelection:
      type: object
      required: [group_id, delete_version_ids]
      additionalProperties: false
      properties:
        group_id: {type: string, minLength: 1, maxLength: 128}
        delete_version_ids: {type: array, minItems: 1, maxItems: 1000, items: {type: string, minLength: 1}}
    CleanupExecuteRequest:
      type: object
      required: [selections, confirmation]
      additionalProperties: false
      properties:
        selections: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/CleanupSelection'}}
        delete_source:
          type: boolean
          default: false
          description: False removes only selected media-library hardlinks. True also removes corresponding complete source data.
        confirmation: {type: string, const: DELETE_SELECTED_DUPLICATES}
    CleanupVersion:
      type: object
      required: [id, media_type, source_paths, target_paths, size, device, inode, link_count, managed, safe]
      properties:
        id: {type: string}
        media_type: {type: string, enum: [movie, tv, anime, custom]}
        path_rule_id: {type: string}
        source_paths: {type: array, items: {type: string}}
        target_paths: {type: array, items: {type: string}}
        size: {type: integer, minimum: 0}
        device: {type: integer}
        inode: {type: integer}
        link_count: {type: integer, minimum: 1}
        mtime_ns: {type: integer}
        resolution: {type: [string, 'null']}
        source: {type: [string, 'null']}
        hdr: {type: [string, 'null']}
        audio: {type: [string, 'null']}
        codec: {type: [string, 'null']}
        torrent_hash: {type: [string, 'null']}
        managed: {type: boolean}
        safe: {type: boolean}
        safety_reason: {type: [string, 'null']}
    CleanupGroup:
      type: object
      required: [id, media_type, identity, recommended_keep_id, versions]
      properties:
        id: {type: string}
        media_type: {type: string, enum: [movie, tv, anime, custom]}
        identity: {type: string}
        recommended_keep_id: {type: string}
        versions: {type: array, minItems: 2, items: {$ref: '#/components/schemas/CleanupVersion'}}
    CleanupPlan:
      type: object
      required: [id, status, policy, created_at, updated_at, groups, summary, results]
      properties:
        id: {type: string}
        status: {type: string, enum: [ready, completed, partial]}
        policy: {$ref: '#/components/schemas/CleanupPolicy'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        groups: {type: array, items: {$ref: '#/components/schemas/CleanupGroup'}}
        summary:
          type: object
          properties:
            groups: {type: integer, minimum: 0}
            logical_duplicate_size: {type: integer, minimum: 0}
            reclaimable_if_source_deleted: {type: integer, minimum: 0}
            estimated_reclaimable: {type: integer, minimum: 0}
        results: {type: array, items: {type: object}}
        error: {type: [string, 'null']}
    Site:
      type: object
      required: [name, base_urls]
      additionalProperties: false
      properties:
        id: {type: string, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 100}
        adapter: {type: string, enum: [sixv, generic], default: generic}
        enabled: {type: boolean, default: true}
        base_urls: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uri}}
        address_page: {type: [string, 'null'], format: uri, description: Optional page used by the sixv adapter to discover the current address.}
        search_url: {type: [string, 'null'], description: 'Generic sites must contain {keyword}; {base_url} is substituted when present.'}
        result_selector: {type: string, default: '.search-item'}
        title_selector: {type: string, default: a}
        link_selector: {type: string, default: a}
        download_selector: {type: string, default: 'a[href]'}
        default_type: {$ref: '#/components/schemas/MediaType'}
        tv_path_patterns: {type: array, items: {type: string}}
        anime_path_patterns: {type: array, items: {type: string}}
        allow_private_hosts:
          type: boolean
          default: false
          description: Explicitly permit private/LAN provider destinations. Disabled by default to mitigate SSRF.
    SitePatch:
      type: object
      additionalProperties: false
      description: Patchable provider fields.
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
        base_urls: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uri}}
        address_page: {type: [string, 'null'], format: uri}
        search_url: {type: [string, 'null']}
        result_selector: {type: [string, 'null']}
        title_selector: {type: [string, 'null']}
        link_selector: {type: [string, 'null']}
        download_selector: {type: [string, 'null']}
        default_type: {$ref: '#/components/schemas/MediaType'}
        tv_path_patterns: {type: [array, 'null'], items: {type: string}}
        anime_path_patterns: {type: [array, 'null'], items: {type: string}}
        allow_private_hosts: {type: boolean, description: Explicitly permit trusted private/LAN destinations.}
    ProviderPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        keyword: {type: string, minLength: 1, maxLength: 100, default: test}
        type: {$ref: '#/components/schemas/MediaType'}
        site_id: {type: [string, 'null'], minLength: 4, maxLength: 64}
    PathRule:
      type: object
      required: [media_type, name, source_path, target_path]
      additionalProperties: false
      properties:
        id: {type: string, readOnly: true}
        media_type: {type: string, enum: [movie, tv, anime, custom]}
        name: {type: string, minLength: 1, maxLength: 100}
        source_path: {type: string}
        downloader_path: {type: string}
        target_path: {type: string}
        enabled: {type: boolean, default: true}
        rename_enabled: {type: boolean, default: true}
        default_download: {type: boolean, default: false}
        created_at: {type: string, readOnly: true}
        updated_at: {type: string, readOnly: true}
    PathRulePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        media_type: {type: string, enum: [movie, tv, anime, custom]}
        name: {type: string, minLength: 1, maxLength: 100}
        source_path: {type: string}
        downloader_path: {type: string}
        target_path: {type: string}
        enabled: {type: boolean}
        rename_enabled: {type: boolean}
        default_download: {type: boolean}
    PathRuleDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        disable_media_path:
          type: boolean
          default: false
          description: Explicitly disable all paths of this media type before removal when this is the final enabled rule.
    PathSettingsPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        qb_movie_category: {type: [string, 'null'], minLength: 1, maxLength: 100}
        qb_tv_category: {type: [string, 'null'], minLength: 1, maxLength: 100}
        qb_anime_category: {type: [string, 'null'], minLength: 1, maxLength: 100}
        qb_custom_category: {type: [string, 'null'], minLength: 1, maxLength: 100}
        downloads_base_path: {type: [string, 'null']}
        download_movie_path: {type: [string, 'null']}
        download_tv_path: {type: [string, 'null']}
        download_anime_path: {type: [string, 'null']}
        download_custom_path: {type: [string, 'null']}
        medialib_movie_path: {type: [string, 'null']}
        medialib_tv_path: {type: [string, 'null']}
        medialib_anime_path: {type: [string, 'null']}
        medialib_custom_path: {type: [string, 'null']}
        medialib_hardlink_enabled: {type: [boolean, 'null']}
    DownloaderSettingsPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        downloader_type:
          type: [string, 'null']
          enum: [qbittorrent, transmission, null]
        qb_host: {type: [string, 'null'], maxLength: 500}
        qb_port: {type: [integer, 'null'], minimum: 1, maximum: 65535}
        qb_username: {type: [string, 'null'], maxLength: 200}
        qb_password: {type: [string, 'null'], maxLength: 1000, writeOnly: true}
        qb_use_https: {type: [boolean, 'null']}
        qb_verify_ssl: {type: [boolean, 'null']}
        transmission_host: {type: [string, 'null'], maxLength: 500}
        transmission_port: {type: [integer, 'null'], minimum: 1, maximum: 65535}
        transmission_username: {type: [string, 'null'], maxLength: 200}
        transmission_password: {type: [string, 'null'], maxLength: 1000, writeOnly: true}
        transmission_use_https: {type: [boolean, 'null']}
        transmission_verify_ssl: {type: [boolean, 'null']}
        transmission_rpc_path: {type: [string, 'null'], minLength: 1, maxLength: 200}
    DownloaderRelocateRequest:
      type: object
      required: [location]
      additionalProperties: false
      properties:
        location: {type: string, description: Absolute downloader-visible path.}
    SystemSettingsPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        watchlist_check_hours: {type: integer, minimum: 3, maximum: 168}
        directory_sync_enabled: {type: boolean, description: Enables filesystem watcher for automatic directory synchronization; manual scans remain available.}
        directory_sync_settle_seconds: {type: integer, minimum: 0, maximum: 86400}
        cleanup_auto_scan_enabled: {type: boolean}
        cleanup_auto_execute_enabled: {type: boolean}
        cleanup_auto_delete_source: {type: boolean}
        cleanup_policy: {$ref: '#/components/schemas/CleanupPolicy'}
        cleanup_scan_hours: {type: integer, minimum: 3, maximum: 168}
    Agent:
      type: object
      required: [id, name, scopes, capabilities, revoked, online]
      properties:
        id: {type: string}
        name: {type: string}
        token: {type: string, writeOnly: true, description: Returned once by bootstrap only; never log it.}
        scopes: {type: array, items: {$ref: '#/components/schemas/AgentScope'}}
        created_at: {type: string}
        connected_at: {type: [string, 'null']}
        last_seen: {type: [string, 'null']}
        capabilities: {type: array, items: {type: string}}
        revoked: {type: boolean}
        online: {type: boolean}
    AgentBootstrapRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, default: My Agent}
        scopes:
          type: array
          maxItems: 7
          default: [read]
          items: {$ref: '#/components/schemas/AgentScope'}
    AgentScopesUpdateRequest:
      type: object
      required: [scopes]
      additionalProperties: false
      properties:
        scopes: {type: array, minItems: 1, maxItems: 7, items: {$ref: '#/components/schemas/AgentScope'}}
    AgentConnectRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, default: My Agent}
        capabilities: {type: array, maxItems: 50, items: {type: string}}
  parameters:
    TaskHash: {in: path, name: task_hash, required: true, schema: {type: string}}
    ItemId: {in: path, name: item_id, required: true, schema: {type: string}}
    JobId: {in: path, name: job_id, required: true, schema: {type: string}}
    SiteId: {in: path, name: site_id, required: true, schema: {type: string}}
    RuleId: {in: path, name: rule_id, required: true, schema: {type: string}}
    AgentId: {in: path, name: agent_id, required: true, schema: {type: string}}
    PlanId: {in: path, name: plan_id, required: true, schema: {type: string}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PerPage: {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  responses:
    Problem:
      description: RFC 7807-style API problem. request_id and field errors are retained for Agent diagnostics.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized: {$ref: '#/components/responses/Problem'}
    Forbidden: {$ref: '#/components/responses/Problem'}
    NotFound: {$ref: '#/components/responses/Problem'}
    Conflict: {$ref: '#/components/responses/Problem'}
    Validation: {$ref: '#/components/responses/Problem'}
paths:
  /health:
    get:
      summary: Liveness probe
      x-agent-scope: none
      responses: {'200': {description: Service version and status}}
  /ready:
    get:
      summary: Dependency readiness probe
      x-agent-scope: none
      responses: {'200': {description: SQLite state, providers and downloader are ready or optional}, '503': {description: Persistent state or a configured dependency is unavailable}}
  /api/search:
    post:
      summary: Search enabled providers
      description: Search is read-only by default and never subscribes unless add_to_watchlist is explicitly true.
      x-agent-scope: search; additionally watchlist when add_to_watchlist=true
      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SearchRequest'}}}}
      responses:
        '200': {description: Search outcome}
        '422': {$ref: '#/components/responses/Validation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/download:
    post:
      summary: Enqueue a selected release
      x-agent-scope: download
      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DownloadRequest'}}}}
      responses: {'200': {description: Added to downloader queue}, '422': {$ref: '#/components/responses/Validation'}, default: {$ref: '#/components/responses/Problem'}}
  /api/download/manual:
    post:
      summary: Enqueue a magnet/link or uploaded torrent
      x-agent-scope: download
      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ManualDownloadRequest'}}
          multipart/form-data: {schema: {$ref: '#/components/schemas/ManualTorrentRequest'}}
      responses: {'200': {description: Added to downloader queue}, '422': {$ref: '#/components/responses/Validation'}, default: {$ref: '#/components/responses/Problem'}}
  /api/download/manual/preview:
    post:
      summary: Preview manual media recognition, route and naming without downloading
      x-agent-scope: download
      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ManualDownloadRequest'}}
          multipart/form-data: {schema: {$ref: '#/components/schemas/ManualTorrentRequest'}}
      responses: {'200': {description: Recognition and naming preview}, '422': {$ref: '#/components/responses/Validation'}, default: {$ref: '#/components/responses/Problem'}}
  /api/downloader/status:
    get:
      summary: Downloader connection status
      x-agent-scope: read
      security: [{ApiKey: []}, {AgentToken: []}]
      responses: {'200': {description: Downloader status}, default: {$ref: '#/components/responses/Problem'}}
  /api/qb/status:
    get:
      summary: Deprecated downloader status alias
      deprecated: true
      x-agent-scope: read
      security: [{ApiKey: []}, {AgentToken: []}]
      responses: {'200': {description: Downloader status}, default: {$ref: '#/components/responses/Problem'}}
  /api/downloader/tasks:
    get:
      summary: List downloader tasks
      x-agent-scope: read
      security: [{ApiKey: []}, {AgentToken: []}]
