      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean, default: true}
      responses: {'200': {description: Deduplication report}, default: {$ref: '#/components/responses/Problem'}}
