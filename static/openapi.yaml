  /api/naming/jobs/{job_id}/retry:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      summary: Retry a naming or hardlink job
      description: Continues using existing downloader work; it does not submit a new download.
      x-agent-scope: naming
      security: [{ApiKey: []}, {AgentToken: []}]
      responses: {'200': {description: Retry report}, '404': {$ref: '#/components/responses/NotFound'}, default: {$ref: '#/components/responses/Problem'}}
  /api/naming/jobs/check:
    post:
      summary: Check one or all pending naming/hardlink jobs
      x-agent-scope: naming
      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NamingCheckRequest'}}}}
      responses: {'200': {description: Check report}, default: {$ref: '#/components/responses/Problem'}}
