  /api/cleanup/scan:
    post:
      summary: Scan enabled media paths and persist a duplicate cleanup plan
      description: Read-only for media files. Normal source/library hardlinks with the same device and inode are treated as one physical version.
      x-agent-scope: cleanup
      security: [{ApiKey: []}, {AgentToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CleanupScanRequest'}}}}
      responses: {'201': {description: Persisted cleanup plan, content: {application/json: {schema: {type: object, properties: {item: {$ref: '#/components/schemas/CleanupPlan'}}}}}}, '422': {$ref: '#/components/responses/Validation'}, default: {$ref: '#/components/responses/Problem'}}
  /api/cleanup/plans:
    get:
      summary: List persisted duplicate cleanup plans
      x-agent-scope: read
      security: [{ApiKey: []}, {AgentToken: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}, {in: query, name: status, schema: {type: string, enum: [ready, completed, partial]}}]
