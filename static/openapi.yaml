openapi: 3.1.0
info:
  title: AI NAS Core API
  version: 1.3.1
  description: 多站点媒体搜索、订阅、下载器调度、Emby 命名和硬链接入库。
servers:
  - url: http://localhost:16666
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        request_id: {type: string}
    SearchRequest:
      type: object
      required: [keyword]
      properties:
        keyword: {type: string, minLength: 1, maxLength: 100, examples: [奥本海默]}
        type: {type: string, enum: [movie, tv, anime, auto], default: auto}
    Release:
      type: object
      required: [id, title, url, download_link, type]
      properties:
        id: {type: string}
        title: {type: string}
        url: {type: string, format: uri}
        download_link: {type: string}
        size: {type: [string, 'null']}
        resolution: {type: [string, 'null']}
        source: {type: [string, 'null']}
        language: {type: [string, 'null']}
        hdr: {type: [string, 'null']}
        encoding: {type: [string, 'null']}
        type: {type: string, enum: [movie, tv, anime, auto]}
        provider: {type: [string, 'null']}
        episode: {type: [string, 'null']}
        media_name: {type: [string, 'null']}
        year: {type: [integer, 'null']}
        season: {type: [integer, 'null']}
        link_name: {type: [string, 'null']}
    Site:
      type: object
      required: [name, adapter, enabled, base_urls]
      properties:
        id: {type: string}
        name: {type: string}
        adapter: {type: string, enum: [sixv, generic]}
        enabled: {type: boolean}
        base_urls: {type: array, items: {type: string, format: uri}}
        search_url: {type: [string, 'null']}
        result_selector: {type: string}
        title_selector: {type: string}
        link_selector: {type: string}
        download_selector: {type: string}
        default_type: {type: string, enum: [movie, tv, anime, auto]}
    PathSettings:
      type: object
      required: [downloads_base_path, download_movie_path, download_tv_path, download_anime_path, medialib_base_path, medialib_mount_path, medialib_movie_path, medialib_tv_path, medialib_anime_path, medialib_hardlink_enabled]
      properties:
        downloads_base_path: {type: string, examples: [/volume1/video/Downloads]}
        download_movie_path: {type: string, examples: [/volume1/video/Downloads/Movie]}
        download_tv_path: {type: string, examples: [/volume1/video/Downloads/TV]}
        download_anime_path: {type: string, examples: [/volume1/video/Downloads/Anime]}
        medialib_base_path: {type: string, readOnly: true, examples: [/volume1/video]}
        medialib_mount_path: {type: string, readOnly: true, examples: [/medialib]}
        medialib_movie_path: {type: string, examples: [/volume1/video/video/movies]}
        medialib_tv_path: {type: string, examples: [/volume1/video/video/tv]}
        medialib_anime_path: {type: string, examples: [/volume1/video/video/anime]}
        medialib_hardlink_enabled: {type: boolean}
    PathSettingsPatch:
      type: object
      minProperties: 1
      properties:
        downloads_base_path: {type: string}
        download_movie_path: {type: string}
        download_tv_path: {type: string}
        download_anime_path: {type: string}
        medialib_movie_path: {type: string}
        medialib_tv_path: {type: string}
        medialib_anime_path: {type: string}
        medialib_hardlink_enabled: {type: boolean}
paths:
  /health:
    get:
      summary: 存活检查
      responses:
        '200': {description: 服务正常}
  /ready:
    get:
      summary: 依赖就绪检查
      responses:
        '200': {description: 依赖正常或可选依赖未配置}
        '503': {description: 已配置的依赖不可用}
  /api/search:
    post:
      summary: 跨已启用站点搜索电影、电视剧或动漫
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: 搜索完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  keyword: {type: string}
                  type: {type: string}
                  results: {type: array, items: {$ref: '#/components/schemas/Release'}}
                  count: {type: integer}
                  watchlisted: {type: boolean}
                  watchlist_id: {type: [string, 'null']}
        '422': {description: 参数错误}
        '502': {description: 已配置媒体站点不可用}
  /api/download:
    post:
      summary: 将所选版本推送到当前下载器
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result_id, download_link, title]
              properties:
                result_id: {type: string}
                download_link: {type: string}
                title: {type: string}
                type: {type: string, enum: [movie, tv, anime, auto], default: auto}
      responses:
        '200': {description: 已加入队列}
        '503': {description: 当前下载器未配置}
  /api/qb/status:
    get:
      summary: 查询 qBittorrent 连接状态
      security: [{ApiKey: []}]
      responses:
        '200': {description: 状态信息}
  /api/qb/tasks:
    get:
      summary: 查询 qBittorrent 任务
      security: [{ApiKey: []}]
      responses:
        '200': {description: 任务列表}
  /api/downloader/status:
    get:
      summary: 查询当前下载器（qBittorrent 或 Transmission）连接状态
      security: [{ApiKey: []}]
      responses:
        '200': {description: 下载器状态}
  /api/downloader/tasks:
    get:
      summary: 查询当前下载器任务
      security: [{ApiKey: []}]
      responses:
        '200': {description: 下载任务列表}
  /api/watchlist/add:
    post:
      summary: 添加监听项目
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '201': {description: 已添加或返回现有项目}
  /api/watchlist:
    get:
      summary: 获取监听列表
      security: [{ApiKey: []}]
      responses:
        '200': {description: 监听列表}
  /api/watchlist/{item_id}:
    delete:
      summary: 删除监听项目
      security: [{ApiKey: []}]
      parameters:
        - in: path
          name: item_id
          required: true
          schema: {type: string}
      responses:
        '204': {description: 已删除}
        '404': {description: 项目不存在}
  /api/watchlist/check:
    post:
      summary: 手动检查全部或单个监听项目
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_id: {type: [string, 'null']}
      responses:
        '200': {description: 检查报告}
  /api/naming/jobs:
    get:
      summary: 分页查看 Emby 规范命名任务
      security: [{ApiKey: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: status, schema: {type: string}}
      responses:
        '200': {description: 命名任务列表}
  /api/naming/jobs/{job_id}:
    get:
      summary: 查看单个命名任务
      security: [{ApiKey: []}]
      parameters:
        - {in: path, name: job_id, required: true, schema: {type: string}}
      responses:
        '200': {description: 命名任务}
        '404': {description: 任务不存在}
  /api/naming/jobs/check:
    post:
      summary: 立即处理全部或指定命名任务
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job_id: {type: [string, 'null']}
      responses:
        '200': {description: 处理报告}
  /api/hardlinks:
    get:
      summary: 分页查看硬链接入库任务
      security: [{ApiKey: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: status, schema: {type: string, default: done}}
      responses:
        '200': {description: 硬链接记录列表}
  /api/settings/sites:
    get:
      summary: 获取媒体站点配置
      security: [{ApiKey: []}]
      responses:
        '200': {description: 站点列表}
    post:
      summary: 添加通用 HTML 媒体站点
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Site'}
      responses:
        '201': {description: 站点已创建}
        '422': {description: 配置无效}
  /api/settings/sites/{site_id}:
    patch:
      summary: 更新站点配置
      security: [{ApiKey: []}]
      parameters:
        - {in: path, name: site_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: 站点已更新}
        '404': {description: 站点不存在}
    delete:
      summary: 删除站点配置
      security: [{ApiKey: []}]
      parameters:
        - {in: path, name: site_id, required: true, schema: {type: string}}
      responses:
        '204': {description: 站点已删除}
  /api/settings/paths:
    get:
      summary: 获取当前下载目录和硬链接目录
      security: [{ApiKey: []}]
      responses:
        '200':
          description: 当前运行时路径设置
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  settings: {$ref: '#/components/schemas/PathSettings'}
    patch:
      summary: 更新下载目录和硬链接目录并立即生效
      description: 所有目录必须是位于 MEDIALIB_BASE_PATH 内的绝对宿主机路径。MEDIALIB_BASE_PATH 本身由 Docker volume 决定，不能通过此接口修改。
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PathSettingsPatch'}
      responses:
        '200': {description: 路径设置已保存并立即生效}
        '422': {description: 路径为空、不是绝对路径、超出根挂载或包含只读设置}
